<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>ImgMenu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;  /* Impede que a barra de rolagem apareça */
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;  /* Ajusta a imagem para cobrir a tela sem distorcer */
    }
  </style>
</head>
<body>
  <img src="background.png" alt="Menu Interface">
</body>
</html>
